// java, mod menu, forge, neoforge, fabric api
def targets = [
    '1.20.1': [17, '7.2.2', '47.4.5', null, '0.92.12+1.20.1'],
    '1.20.2': [17, '8.0.1', '48.1.0', '20.2.93', '0.91.6+1.20.2'],
    '1.20.3': [17, '9.0.0', '49.0.2', '20.3.8-beta', '0.91.1+1.20.3'],
    '1.20.4': [17, '9.2.0', '49.2.0', '20.4.253', '0.97.3+1.20.4'],
    '1.20.5': [21, '10.0.0', null, '20.5.21-beta', '0.97.8+1.20.5'],
    '1.20.6': [21, '10.0.0', '50.2.1', '20.6.144', '0.100.8+1.20.6']
]
def target = targets[minecraft_version]
if (target == null) {
    throw new GradleException("Unsupported Minecraft version: ${minecraft_version}. Choose ${targets.keySet().join(', ')}.")
}
allprojects {
    def sharedVersions = minecraft_version in ['1.20.3', '1.20.4']
        ? ['1.20.3', '1.20.4']
        : minecraft_version in ['1.20.5', '1.20.6'] && name != 'forge'
            ? ['1.20.5', '1.20.6'] : [minecraft_version]
    ext.minecraft_supported_versions = sharedVersions
    ext.minecraft_artifact_version = sharedVersions.join('-')
    ext.minecraft_version_predicate = sharedVersions.size() == 1 ? minecraft_version
        : ">=${sharedVersions.first()} <=${sharedVersions.last()}"
    ext.java_version = target[0]
    ext.resource_pack_format = ['1.20.1': 15, '1.20.2': 18, '1.20.3': 22,
        '1.20.4': 22, '1.20.5': 32, '1.20.6': 32][minecraft_version]
    ext.modmenu_version = target[1]
    ext.fabric_version = target[4]
    ext.forge_version = target[2]
    ext.forge_min_version = minecraft_version == '1.20.1' ? '47.1.0'
        : minecraft_version in ['1.20.3', '1.20.4'] ? targets['1.20.3'][2] : target[2]
    ext.neoforge_version = target[3] ?: 'none'
    ext.minecraft_version_range = "[${sharedVersions.join(',')}]"
    ext.forge_loader_version_range = "[${target[2]?.tokenize('.')?.first() ?: 0},)"
    def neoMinimum = sharedVersions.size() == 2 ? targets[sharedVersions.first()][3] : target[3]
    ext.neoforge_version_range = "[${neoMinimum ?: 0},)"
    ext.neoforge_loader_version_range = target[0] == 21 ? '[3,)' : '[1,)'
}
